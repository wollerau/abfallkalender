<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abfallkalender abonnieren | Gemeinde Wollerau</title>
  <style>
    :root {
      --blau: #3b4668;      /* Wappen- und Menüfarbe der Gemeinde */
      --blau-dunkel: #2c3552;
      --gold: #7d6d50;      /* Akzent der Gemeindewebsite (leicht abgedunkelt für Lesbarkeit) */
      --linie: #dcdcdc;
      --grund: #f4f4f6;
      --text: #111;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; color: var(--text); background: #fff; line-height: 1.55; font-size: 1.0625rem;
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    a { color: var(--blau); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    header.kopf { background: #fff; box-shadow: 0 6px 14px -8px rgba(0,0,0,.35); position: relative; }
    header.kopf .innen { max-width: 680px; margin: 0 auto; padding: .55rem 1.25rem; display: flex; align-items: center; }
    header.kopf a { display: block; line-height: 0; }
    .wappen { height: 64px; width: auto; fill: var(--blau); }

    main { max-width: 680px; margin: 0 auto; padding: 2.2rem 1.25rem 3rem; }
    h1 { font-size: 1.9rem; line-height: 1.2; font-weight: 700; margin: 0 0 .8rem; }
    h2 { font-size: 1.15rem; margin: 2rem 0 .4rem; font-weight: 700; }
    p { margin: 0 0 1rem; }
    .hinweis { color: #444; font-size: .95rem; margin-bottom: .6rem; }

    /* Übersicht: Zeilen mit feinen Linien wie die Tabelle auf wollerau.ch */
    ul.liste { list-style: none; margin: 1.4rem 0 0; padding: 0; border-top: 1px solid var(--linie); }
    ul.liste li { border-bottom: 1px solid var(--linie); }
    ul.liste a { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem .25rem;
                 text-decoration: none; color: var(--text); font-weight: 700; }
    ul.liste a::after { content: "›"; font-size: 1.6rem; line-height: 1; color: var(--gold); font-weight: 400; }
    ul.liste a:hover { background: var(--grund); }

    /* Kalender-Seite */
    a.btn { display: block; padding: .95rem 1.1rem; margin: .6rem 0; background: var(--blau); color: #fff;
            text-decoration: none; border-radius: 2px; text-align: center; font-weight: 700; }
    a.btn:hover { background: var(--blau-dunkel); }

    .codebox { background: var(--grund); border: 1px solid var(--linie); border-left: 4px solid var(--gold);
               padding: .75rem .85rem; font-family: ui-monospace, Consolas, Menlo, monospace; font-size: .8rem;
               word-break: break-all; user-select: all; }
    button.copy { margin-top: .6rem; padding: .7rem 1.2rem; border: 0; border-radius: 2px; background: var(--gold);
                  color: #fff; font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; }
    button.copy:hover { background: #685a41; }
    button.copy.ok { background: #2e6b3a; }

    .zurueck { margin-top: 2rem; }
    footer { max-width: 680px; margin: 0 auto; padding: 1.2rem 1.25rem 2.5rem; border-top: 1px solid var(--linie);
             font-size: .9rem; color: #555; }
  </style>
</head>

    <h1 id="titel">Abfallkalender abonnieren</h1>
    <p id="intro">Integrieren Sie die Termine in Ihren persönlichen Kalender. Er wird danach automatisch aktualisiert.</p>
    <div id="inhalt"></div>

    Gemeinde Wollerau, Abteilung Infrastruktur &ndash;
    <a href="https://www.wollerau.ch/leben-in-wollerau/77323">Recycling und Entsorgung</a>

  <script>
    // Kürzel -> Name + Kalender-ID
    var KALENDER = {
      kehricht:  { name: "🗑️ Kehricht",          id: "4b98c002208ae2f63f3f91bcd320c3c59850bfedfe00b33530f2586152cc8bff" },
      gruengut:  { name: "🪴 Grüngut",           id: "29483cf80f9d175c6cb5b27d7cbfc15c938c1f9c22d723922d15daa57de2cc0f" },

    var k = new URLSearchParams(location.search).get("k");
    var cal = KALENDER[k];
    var inhalt = document.getElementById("inhalt");

    if (!cal) {
      document.getElementById("intro").textContent = "Wählen Sie den Kalender, den Sie abonnieren möchten. Er wird danach automatisch aktualisiert.";
      var html = '<ul class="liste">';
      for (var key in KALENDER) {
        html += '<li><a href="?k=' + key + '">' + KALENDER[key].name + '</a></li>';
      }
      inhalt.innerHTML = html + '</ul>';
    } else {
      var adresse = cal.id + "@group.calendar.google.com";
      var icsPfad = "calendar.google.com/calendar/ical/" + cal.id + "%40group.calendar.google.com/public/basic.ics";
      var googleLink = "https://calendar.google.com/calendar/u/0?cid=" + btoa(adresse).replace(/=+$/, "");
      var webcalLink = "webcal://" + icsPfad;
      var icsLink = "https://" + icsPfad;

      document.title = cal.name.replace(/^\S+\s/, "") + " abonnieren | Gemeinde Wollerau";
      document.getElementById("titel").textContent = cal.name;
      document.getElementById("intro").textContent = "Abonnieren Sie diesen Kalender. Er wird danach automatisch aktualisiert.";

      inhalt.innerHTML =
        '<a class="btn" href="' + webcalLink + '">In Apple Kalender abonnieren</a>' +
        '<a class="btn" href="' + googleLink + '">In Google Kalender abonnieren</a>' +
        '<h2>Outlook, Thunderbird und andere Programme</h2>' +
        '<p class="hinweis">Link kopieren und im Kalenderprogramm als «Kalender per URL abonnieren» einfügen:</p>' +
        '<div class="codebox" id="icsbox"></div>' +
        '<button class="copy" id="copybtn" type="button">Link kopieren</button>' +
        '<p class="zurueck"><a href="./">Alle Kalender anzeigen</a></p>';

      document.getElementById("icsbox").textContent = icsLink;

      document.getElementById("copybtn").addEventListener("click", function () {
        var btn = this;
        function fertig() {
          btn.textContent = "Kopiert ✓";
          btn.classList.add("ok");
          setTimeout(function () { btn.textContent = "Link kopieren"; btn.classList.remove("ok"); }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(icsLink).then(fertig);
        } else {
          var r = document.createRange();
          r.selectNodeContents(document.getElementById("icsbox"));
          var s = getSelection(); s.removeAllRanges(); s.addRange(r);
          document.execCommand("copy");
          fertig();
        }
      });

      // Auf iPhone, iPad und Mac direkt das Abo auslösen
      var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
      if (apple) { setTimeout(function () { location.href = webcalLink; }, 400); }
    }
  </script>
</body>
</html>
